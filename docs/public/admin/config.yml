# 后端配置
backend:
  name: github
  repo: I8Zoro8I/zoro_blog
  branch: main
  base_url: https://snowy-frost-15b9.m15860860386.workers.dev
  auth_endpoint: auth

media_folder: "docs/public/images"
public_folder: "/images"

collections:
  - name: "column"
    label: "内容管理"
    folder: "docs/column"
    identifier_field: slug
    create: true
    path: "{{new_folder}}/{{slug}}"
    slug: "{{slug}}"
    fields:
      - { label: "所属分类 (文件夹名)", name: "new_folder", widget: "string", default: "Algorithm" }
      - { label: "文章标题", name: "title", widget: "string" }
      - { label: "文件名 (URL路径)", name: "slug", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime" }
      - { label: "系列", name: "series", widget: "string", required: false }
      - { label: "分类名称", name: "category", widget: "string", required: false }
      - { label: "分组名称", name: "group", widget: "string", required: false }
      - label: "标签"
        name: "tags"
        widget: "list"
        required: false
        field: { label: "标签名", name: "tag", widget: "string" }
      - { label: "正文内容", name: "body", widget: "markdown" }
